<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AES — Resource Utilization Report</title>
<style>
:root{--pwc-orange:#D04A02;--pwc-dark:#21252E;--pwc-navy:#2D4A8A;--pwc-teal:#00827F;--pwc-red:#C0392B;--pwc-purple:#7C3A8C;--pwc-gold:#C07A00;--bg:#F4F5F7;--white:#FFF;--border:#D8DCE4;--text:#1A1D26;--text2:#4A4F65;--text3:#8890AA;--band-red:#FDECEA;--band-org:#FEF3E7;--band-yel:#FEF9E7;--band-teal:#E8F6F5}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.nav{position:sticky;top:0;z-index:200;background:var(--pwc-dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:50px;gap:6px}
.nav-brand{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}.nav-brand .pwc{font-size:17px;font-weight:900;color:var(--pwc-orange)}
.nav-slides{display:flex;gap:1px;overflow-x:auto;flex-shrink:1}
.snav{padding:5px 9px;border:none;background:transparent;color:rgba(255,255,255,.5);font-size:10px;cursor:pointer;border-radius:3px;transition:all .12s;font-family:inherit;white-space:nowrap}
.snav:hover,.snav.active{background:var(--pwc-orange);color:#fff}
.dl-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;background:var(--pwc-orange);border:none;color:#fff;font-size:10px;font-weight:600;border-radius:3px;cursor:pointer;font-family:inherit;white-space:nowrap}.dl-btn:hover{background:#b03e00}
.slides-container{padding:20px;max-width:1280px;margin:0 auto}
.slide{display:none;background:var(--white);border-radius:4px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}.slide.active{display:block}
.slide-header{background:var(--pwc-dark);color:#fff;padding:11px 22px;display:flex;align-items:center;justify-content:space-between}
.slide-header-title{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}.slide-header-sub{font-size:10px;color:rgba(255,255,255,.5)}
.slide-body{padding:20px 22px 14px}
.slide-footer{border-top:1px solid var(--border);padding:5px 22px;display:flex;justify-content:space-between;font-size:9px;color:var(--text3)}

/* Cover */
.cover-top{padding:18px 28px 14px;border-left:6px solid var(--pwc-orange)}
.pwc-logo{font-size:24px;font-weight:900;color:var(--pwc-dark);margin-bottom:10px}
.cover-eyebrow{font-size:11px;color:var(--text3);margin-bottom:16px}
.cover-title{font-size:40px;font-weight:900;color:var(--pwc-dark);line-height:1.05;margin-bottom:16px}
.cover-subtitle{font-size:12px;color:var(--pwc-orange);font-weight:600;margin-bottom:16px}
.cover-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--border)}
.ckpi{padding:14px;border-right:1px solid var(--border);background:#F8F9FB;cursor:pointer;transition:background .12s;position:relative}
.ckpi:last-child{border-right:none}.ckpi:hover{background:#EEF0F8}
.ckpi-val{font-size:30px;font-weight:900;line-height:1;margin-bottom:5px}
.ckpi-label{font-size:9px;color:var(--text2);line-height:1.3}
.ckpi-drill{position:absolute;top:5px;right:6px;font-size:8px;color:var(--text3);opacity:0;transition:opacity .12s}.ckpi:hover .ckpi-drill{opacity:1}
.cover-dcs{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--border)}
.cdc{padding:10px 14px;border-right:1px solid var(--border);background:#FAFBFD;cursor:pointer;transition:background .12s;text-align:center}
.cdc:last-child{border-right:none}.cdc:hover{background:#EEF0F8}
.cdc-name{font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.cdc-num{font-size:20px;font-weight:900;color:var(--pwc-dark)}
.cdc-sub{font-size:9px;color:var(--text3)}
.cover-upload{padding:12px 28px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload-zone{flex:1;min-width:250px;border:2px dashed var(--border);border-radius:6px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;font-size:11px;color:var(--text2)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--pwc-orange);background:#FFF8F4}
.or-sep{color:var(--text3);font-size:10px;font-weight:600}
.paste-btn{padding:7px 14px;border:1.5px solid var(--border);border-radius:6px;font-size:11px;cursor:pointer;background:var(--white);color:var(--text);font-family:inherit}.paste-btn:hover{border-color:var(--pwc-orange);color:var(--pwc-orange)}
#file-input{display:none}
.cover-bottom{padding:7px 28px;font-size:9px;color:var(--text3);border-top:1px solid var(--border)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--white);border-radius:8px;max-width:820px;width:95%;max-height:82vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-head{background:var(--pwc-dark);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0}
.modal-head h3{font-size:13px;font-weight:700}
.modal-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 4px}
.modal-body{padding:14px 18px}
.modal-body table{width:100%;border-collapse:collapse;font-size:11px}
.modal-body th{background:#F0F2F8;padding:6px 8px;text-align:left;font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;border-bottom:1.5px solid var(--border);position:sticky;top:0}
.modal-body td{padding:6px 8px;border-bottom:1px solid var(--border)}
.modal-body tr:hover td{background:#FAFBFD}
.util-pill{display:inline-flex;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:600}
.util-pill.high{background:#dcfce7;color:#16a34a}.util-pill.mid{background:#fef3c7;color:#b45309}.util-pill.low{background:#fee2e2;color:#dc2626}

/* Paste Modal */
.paste-area{width:100%;min-height:160px;border:1.5px solid var(--border);border-radius:4px;padding:10px;font-size:11px;font-family:monospace;resize:vertical}.paste-area:focus{outline:none;border-color:var(--pwc-orange)}
.paste-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.btn-action{padding:6px 14px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;border:1.5px solid var(--border);background:var(--white);color:var(--text)}
.btn-action.primary{background:var(--pwc-orange);border-color:var(--pwc-orange);color:#fff}.btn-action.primary:hover{background:#b03e00}

/* Exec Summary */
.situation-box{border:1.5px solid var(--border);border-left:5px solid var(--pwc-orange);border-radius:2px;padding:12px 16px;margin-bottom:12px;background:#FFFAF7;font-size:11px;line-height:1.55}
.situation-box b{color:var(--pwc-dark)}.sit-highlight{color:var(--pwc-orange);font-weight:700}
.summary-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1.5px solid var(--border);border-radius:2px;overflow:hidden;margin-bottom:12px}
.sum-card{border-right:1px solid var(--border);cursor:pointer;transition:transform .1s}.sum-card:last-child{border-right:none}.sum-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.sum-card-head{padding:5px 8px;font-size:8px;font-weight:700;letter-spacing:.4px;text-align:center;color:#fff;text-transform:uppercase}
.sum-card-body{padding:10px 8px 7px;text-align:center;background:#fff}
.sum-card-num{font-size:32px;font-weight:900;line-height:1;margin-bottom:2px}
.sum-card-res{font-size:9px;color:var(--text3)}.sum-card-util{font-size:10px;font-weight:700;margin-top:3px}
.s1h{background:var(--pwc-orange)}.s1c{color:var(--pwc-orange)}.s2h{background:var(--pwc-navy)}.s2c{color:var(--pwc-navy)}.s3h{background:var(--pwc-teal)}.s3c{color:var(--pwc-teal)}.s4h{background:var(--pwc-red)}.s4c{color:var(--pwc-red)}.s5h{background:var(--pwc-purple)}.s5c{color:var(--pwc-purple)}.s6h{background:var(--pwc-gold)}.s6c{color:var(--pwc-gold)}
.summary-lower{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-desc-list{background:#FAFBFD;border:1px solid var(--border);border-radius:2px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sum-desc{display:flex;gap:8px}.sum-desc-bar{width:4px;min-width:4px;border-radius:2px}
.sum-desc-content h4{font-size:11px;font-weight:700;margin-bottom:2px}.sum-desc-content p{font-size:10px;color:var(--text2);line-height:1.35}
.target-box{background:#FFF8F0;border:1.5px solid var(--pwc-orange);border-radius:2px;padding:12px 14px}
.target-box .target-label{font-size:9px;font-weight:700;color:var(--pwc-orange);margin-bottom:4px}.target-box p{font-size:11px;line-height:1.45}

/* Detail Slides */
.detail-grid{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:500px}
.detail-left{background:#F8F9FB;border-right:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.left-header{font-size:8px;font-weight:700;letter-spacing:.5px;color:var(--text3);text-align:center;border-bottom:1px solid var(--border);padding-bottom:5px;text-transform:uppercase}
.left-big{text-align:center;padding:6px 0 2px}
.left-big-num{font-size:56px;font-weight:900;line-height:1}
.left-progress{height:6px;border-radius:4px;background:var(--border);margin:2px 0 6px;overflow:hidden}
.left-progress-fill{height:100%;border-radius:4px}
.left-big-util{font-size:13px;font-weight:700}.left-big-target{font-size:9px;color:var(--text3);font-style:italic}
.left-stat{background:var(--white);border:1px solid var(--border);border-radius:2px;padding:7px 10px;text-align:center;cursor:pointer;transition:background .12s}.left-stat:hover{background:#F0F2F8}
.left-stat-num{font-size:20px;font-weight:900}.left-stat-label{font-size:9px;color:var(--text3);margin-top:1px}
.detail-right{display:flex;flex-direction:column}
.right-problem{padding:10px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:110px 1fr;gap:12px;background:#FAFBFD}
.prob-label{font-size:8px;font-weight:700;letter-spacing:.4px;color:var(--text3);text-transform:uppercase;padding-top:2px}
.prob-text{font-size:11px;line-height:1.45}
.right-section{padding:10px 16px;border-bottom:1px solid var(--border)}
.section-label{font-size:8px;font-weight:700;letter-spacing:.4px;color:var(--text3);text-transform:uppercase;margin-bottom:7px}
.dist-bands{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.dist-band{border-radius:2px;padding:10px 5px;text-align:center;cursor:pointer;transition:transform .1s}.dist-band:hover{transform:scale(1.03)}
.db-num{font-size:22px;font-weight:900;line-height:1}.db-label{font-size:9px;color:var(--text2);margin-top:2px;font-weight:500}
.b0{background:var(--band-red)}.b0 .db-num{color:#C0392B}.b1{background:var(--band-org)}.b1 .db-num{color:#D04A02}.b2{background:var(--band-yel)}.b2 .db-num{color:#C07A00}.b3{background:var(--band-teal)}.b3 .db-num{color:#00827F}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.profile-bars{display:flex;flex-direction:column;gap:5px}
.pbar-row{display:flex;align-items:center;gap:5px;font-size:10px}
.pbar-label{width:100px;text-align:right;color:var(--text2);flex-shrink:0}
.pbar-track{flex:1;height:15px;background:var(--bg);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;display:flex;align-items:center;padding-right:4px;justify-content:flex-end;font-size:9px;font-weight:700;color:#fff;min-width:18px}
.practice-list{display:flex;flex-direction:column;gap:5px}
.practice-item{display:flex;align-items:center;gap:5px;font-size:10px}
.practice-dot{width:7px;height:7px;border-radius:1px;flex-shrink:0}
.projects-row{font-size:10px;color:var(--text2)}
.actions-section{background:#FAFBFD;border-top:1px solid var(--border);padding:10px 16px;flex:1}
.actions-label{font-size:8px;font-weight:700;letter-spacing:.4px;color:var(--pwc-orange);text-transform:uppercase;margin-bottom:6px}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.action-item{display:flex;gap:5px;font-size:10px;line-height:1.35}.action-arrow{color:var(--pwc-orange);font-weight:700;flex-shrink:0}

/* Next Steps */
.ns-table{width:100%;border-collapse:collapse;font-size:11px}
.ns-table th{background:var(--pwc-dark);color:#fff;padding:7px 10px;text-align:left;font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}.ns-table th.center{text-align:center}
.ns-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}.ns-table tr:hover td{background:#FAFBFD}
.ns-reason{font-size:11px;font-weight:700}.ns-big{font-size:20px;font-weight:900;text-align:center}.ns-util{font-size:11px;font-weight:600;text-align:center}.ns-owner{font-size:9px;color:var(--text2);text-align:center;line-height:1.3}
.tl-badge{display:inline-block;padding:3px 7px;border-radius:2px;font-size:9px;font-weight:700;line-height:1.3;text-align:center;min-width:75px}
.tl-immediate{background:#FFF0E8;color:var(--pwc-orange);border:1px solid #FFCBA4}.tl-nearterm{background:#EAF3FF;color:var(--pwc-navy);border:1px solid #AACCEE}
.tl-urgent{background:#FDECEA;color:var(--pwc-red);border:1px solid #F5AAAA}.tl-monitor{background:#EEF0F7;color:var(--pwc-purple);border:1px solid #C5B8D8}
.target-bar{background:#FFF0E0;border:1.5px solid var(--pwc-orange);border-radius:2px;padding:9px 14px;margin-top:10px;font-size:11px;line-height:1.4}.target-bar .tb-label{font-size:9px;font-weight:700;color:var(--pwc-orange);margin-bottom:2px}

/* Overall Data */
.ov-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.of-group{display:flex;align-items:center;gap:3px}.of-label{font-size:9px;color:var(--text3);font-weight:600}
.of-select{padding:4px 6px;border:1.5px solid var(--border);border-radius:3px;font-size:10px;background:var(--white);cursor:pointer;max-width:160px}.of-select:focus{outline:none;border-color:var(--pwc-orange)}
.of-search{padding:4px 8px;border:1.5px solid var(--border);border-radius:3px;font-size:10px;width:150px}.of-search:focus{outline:none;border-color:var(--pwc-orange)}
.ov-count{font-size:10px;color:var(--pwc-orange);font-weight:600;margin-left:auto}
.ov-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:4px;max-height:70vh}
.ov-table{width:100%;border-collapse:collapse;font-size:10px}
.ov-table th{background:#F0F2F8;padding:6px 8px;text-align:left;font-size:8px;font-weight:700;color:var(--text3);text-transform:uppercase;border-bottom:1.5px solid var(--border);position:sticky;top:0;cursor:pointer;white-space:nowrap;user-select:none;z-index:2}.ov-table th:hover{color:var(--pwc-orange)}
.ov-table td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}.ov-table tr:hover td{background:#FAFBFD}
.remark-btn{padding:2px 6px;border:1px solid var(--border);border-radius:3px;font-size:9px;cursor:pointer;background:var(--white);color:var(--text2);font-family:inherit}.remark-btn:hover{border-color:var(--pwc-orange);color:var(--pwc-orange)}
.remark-text{font-size:9px;color:var(--text);max-width:200px;white-space:normal;line-height:1.3}
.remark-meta{font-size:8px;color:var(--text3);margin-top:1px}

/* Remark Modal */
.remark-form{display:flex;flex-direction:column;gap:8px}
.remark-form label{font-size:11px;font-weight:600;color:var(--text2)}
.remark-form input,.remark-form textarea{padding:7px 10px;border:1.5px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit}.remark-form input:focus,.remark-form textarea:focus{outline:none;border-color:var(--pwc-orange)}
.remark-form textarea{min-height:80px;resize:vertical}
.remark-history{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.remark-entry{padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
.remark-entry:last-child{border-bottom:none}
.remark-entry .re-meta{font-size:9px;color:var(--text3)}

.toast{position:fixed;bottom:14px;right:14px;background:var(--pwc-dark);color:#fff;padding:7px 12px;border-radius:4px;font-size:11px;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><span class="pwc">PwC</span> AES — Resource Utilization Report</div>
  <div class="nav-slides" id="slide-nav"></div>
  <div class="nav-actions">
    <button class="dl-btn" onclick="downloadPage()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download
    </button>
  </div>
</nav>
<div class="slides-container" id="slides-container"></div>
<div class="modal-overlay" id="drill-modal" onclick="if(event.target===this)closeDrill()"><div class="modal"><div class="modal-head"><h3 id="drill-title">Details</h3><button class="modal-close" onclick="closeDrill()">&times;</button></div><div class="modal-body" id="drill-body"></div></div></div>
<div class="modal-overlay" id="paste-modal" onclick="if(event.target===this)closePaste()"><div class="modal"><div class="modal-head"><h3>Paste CSV / Excel Data</h3><button class="modal-close" onclick="closePaste()">&times;</button></div><div class="modal-body"><p style="font-size:11px;color:var(--text2);margin-bottom:6px">Copy from Excel (Ctrl+A, Ctrl+C) and paste below. First row = header.</p><textarea class="paste-area" id="paste-area" placeholder="Paste data here..."></textarea><div class="paste-actions"><button class="btn-action" onclick="closePaste()">Cancel</button><button class="btn-action primary" onclick="parsePasted()">Load Data</button></div></div></div></div>
<div class="modal-overlay" id="remark-modal" onclick="if(event.target===this)closeRemark()"><div class="modal" style="max-width:500px"><div class="modal-head"><h3 id="remark-title">Add Remark</h3><button class="modal-close" onclick="closeRemark()">&times;</button></div><div class="modal-body" id="remark-body"></div></div></div>

function parseCSV(text){const rows=[];const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for(const line of lines){if(!line.trim())continue;const row=[];let inQ=false,cell='';
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')inQ=!inQ;else if((ch===','||ch==='\t')&&!inQ){row.push(cell.trim());cell='';}else cell+=ch;}
  row.push(cell.trim());rows.push(row);}return rows;}
function pct(s){if(!s)return 0;const v=parseFloat(s.replace(/%/g,'').replace(/,/g,''));return isNaN(v)?0:v;}
function num(s){if(!s)return 0;const v=parseFloat(s.replace(/,/g,''));return isNaN(v)?0:v;}

function mapRows(text){
  const rows=parseCSV(text);if(rows.length<2)return[];const h=rows[0];
  const find=function(){for(let a=0;a<arguments.length;a++){const n=arguments[a];for(let i=0;i<h.length;i++){if(h[i].toLowerCase().indexOf(n.toLowerCase())>=0)return i;}}return -1;};
  const iWD=find('workday'),iEmp=find('employee'),iSt=find('status'),iLvl=find('level'),
    iDC=find('delivery center','delivery centres'),iJF=find('job family'),iDep=find('deployer'),
    iAv=find('current avail'),iProj=find('current project'),iLk=find('leakage reason'),
    iUtil=find('avg -res util'),iFY=find('avg fytd'),iTgt=find('util target'),
    iCap=find('capacity'),iCli=find('client hrs'),iIdle=find('idle'),iLv=find('leave hrs'),
    iLD=find('l&d'),iHol=find('holiday'),iFin=find('finance hrs'),iOth=find('other hrs'),
    iPlan=find('planned'),iTot=find('total hrs'),iOver=find('hours over'),
    iFeb=find('feb'),iMar=find('mar'),iApr=find('apr'),iMay=find('may');
  // Fallback: if DC not found by 'delivery center', try 'ac' but only at word boundary
  const iDCf=(iDC>=0)?iDC:h.findIndex(x=>/\bac\b/i.test(x));

  return rows.slice(1).map(function(r){
    const g=function(i){return i>=0?(r[i]||'').trim():'';};
    return{wdId:g(iWD),employee:g(iEmp),status:g(iSt),level:g(iLvl),dc:g(iDCf),jobFamily:g(iJF),deployer:g(iDep),
      availability:pct(g(iAv)),currentProject:g(iProj),leakageReason:g(iLk),
      avgUtil:pct(g(iUtil)),fytdUtil:pct(g(iFY)),utilTarget:pct(g(iTgt)),
      planned:num(g(iPlan)),capacity:num(g(iCap)),clientHrs:num(g(iCli)),
      idleHrs:num(g(iIdle)),leaveHrs:num(g(iLv)),ldHrs:num(g(iLD)),holidayHrs:num(g(iHol)),
      financeHrs:num(g(iFin)),otherHrs:num(g(iOth)),totalHrs:num(g(iTot)),hoursOver:num(g(iOver)),
      febUtil:g(iFeb)?pct(g(iFeb)):null,marUtil:g(iMar)?pct(g(iMar)):null,
      aprUtil:g(iApr)?pct(g(iApr)):null,mayUtil:g(iMay)?pct(g(iMay)):null};
  }).filter(function(r){return r.employee;});
}

function avg(arr){return arr.length?arr.reduce(function(a,b){return a+b;},0)/arr.length:0;}
function countBy(arr,fn){var m={};arr.forEach(function(r){var k=fn(r);m[k]=(m[k]||0)+1;});return m;}
function topN(obj,n){return Object.entries(obj).sort(function(a,b){return b[1]-a[1];}).slice(0,n);}
function getCohort(){return DATA.filter(function(r){return r.avgUtil<80;});}
function getCatData(key){if(key==='__unassigned__'){return DATA.filter(function(r){var found=false;LEAKAGE_CATS.forEach(function(c){if(c.key!=='__unassigned__'&&c.key===r.leakageReason)found=true;});return !found&&r.avgUtil<80;});}return DATA.filter(function(r){return r.leakageReason===key&&r.avgUtil<80;});}
function getAllCatData(key){if(key==='__unassigned__'){return DATA.filter(function(r){var found=false;LEAKAGE_CATS.forEach(function(c){if(c.key!=='__unassigned__'&&c.key===r.leakageReason)found=true;});return !found;});}return DATA.filter(function(r){return r.leakageReason===key;});}
function utilPill(v){if(v===null)return'<span style="color:var(--text3)">—</span>';var cls=v>=90?'high':v>=70?'mid':'low';return '<span class="util-pill '+cls+'">'+Math.round(v)+'%</span>';}

function openDrill(title,rows,cols){
  document.getElementById('drill-title').textContent=title;
  var html='<div style="max-height:60vh;overflow:auto"><table><thead><tr>';
  cols.forEach(function(c){html+='<th>'+c.label+'</th>';});
  html+='</tr></thead><tbody>';
  rows.forEach(function(r){html+='<tr>';cols.forEach(function(c){var v=c.render?c.render(r):(r[c.key]||'—');html+='<td>'+v+'</td>';});html+='</tr>';});
  html+='</tbody></table></div>';
  document.getElementById('drill-body').innerHTML=html;
  document.getElementById('drill-modal').classList.add('open');
}
function closeDrill(){document.getElementById('drill-modal').classList.remove('open');}

  SLIDE_NAMES.forEach(function(name,i){var b=document.createElement('button');b.className='snav'+(i===0?' active':'');b.textContent=name;b.onclick=function(){goTo(i);};nav.appendChild(b);});
  C.innerHTML=renderCover()+renderExecSummary();
  LEAKAGE_CATS.forEach(function(cat,i){C.innerHTML+=renderDetail(i+2,cat);});
  C.innerHTML+=renderNextSteps()+renderOverallData();
  goTo(currentSlide);
}

function getProblem(k,n,au){var m={'Leakage from Project':n+' resources are 100% allocated to active projects but are NOT charging hours per their allocation. This is active revenue leakage from billable client work.','Partial On Bench':n+' resources are partially deployed (25–75% allocation) with remaining availability unbilled. Existing project engagement is too low to reach utilisation targets.','New Project-WBS to be received':n+' resources have been staffed onto new projects but WBS codes have not been issued yet. Resources cannot charge hours — creating an artificial but avoidable leakage gap.','On Bench':n+' resources are 100% unallocated and on bench with negligible utilisation (avg '+au+'%). These are the highest-urgency resources requiring immediate placement.','Recently Allocated to project':n+' resources have been recently allocated to projects and are in the early ramp-up phase. Utilisation is below target due to project onboarding.','__unassigned__':n+' resources are below 80% utilisation but have no category assigned. These are predominantly in Mexico AC, US Non AC, and Buenos Aires AC. Immediate classification and deployer action required.'};return m[k]||'';}
function getActions(k){var m={'Leakage from Project':['Engage project managers to identify root cause of charging shortfall','Request all resources to immediately update timesheets to reflect confirmed allocation','Conduct weekly leakage review with project leads until utilisation gap is closed','Prioritise resources at 0–20% utilisation for urgent escalation'],'Partial On Bench':['Identify supplementary project slots for partially allocated resources','Engage pipeline team to fast-track next assignments for available resources','Review resources for upcoming allocation escalation','Target cross-staffing opportunities across practices'],'New Project-WBS to be received':['PMO / Finance to expedite WBS code issuance immediately','Set a 5-business-day SLA for WBS issuance from project award','Track WBS pending cases weekly in leakage dashboard until resolved','Ensure resources book 100% of hours as soon as WBS codes are confirmed'],'On Bench':['Initiate immediate staffing search for all bench resources','Engage staffing leads to identify local or remote project opportunities','Consider cross-practice deployment if pipeline is thin','Set 4-week placement target; escalate to leadership if unresolved'],'Recently Allocated to project':['Monitor utilisation over next 2–4 weeks as onboarding completes','Confirm project start dates and charging schedules with project managers','No immediate escalation — flag for review if util remains below 70% after 4 weeks','Include in next monthly review to confirm improvement'],'__unassigned__':['Classify all unassigned resources into proper categories immediately','Deployers to review Mexico AC and US Non AC resources','Assign categories and corrective actions for each resource','Track classification progress weekly']};return m[k]||[];}

var ovSortKey='avgUtil',ovSortDir=-1;
function populateOvFilters(){
  var sets={dc:new Set(),level:new Set(),jf:new Set(),dep:new Set(),leak:new Set(),proj:new Set()};
  DATA.forEach(function(r){sets.dc.add(r.dc);sets.level.add(r.level);sets.jf.add(r.jobFamily);sets.dep.add(r.deployer);if(r.leakageReason)sets.leak.add(r.leakageReason);if(r.currentProject)sets.proj.add(r.currentProject);});
  function fill(id,s){var sel=document.getElementById(id);if(!sel)return;var f=sel.innerHTML.split('</option>').slice(0,id==='ov-leak'?2:1).join('</option>')+'</option>';sel.innerHTML=f;
    Array.from(s).filter(Boolean).sort().forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v.length>40?v.substring(0,40)+'…':v;sel.appendChild(o);});}
  fill('ov-dc',sets.dc);fill('ov-level',sets.level);fill('ov-jf',sets.jf);fill('ov-dep',sets.dep);fill('ov-leak',sets.leak);fill('ov-proj',sets.proj);
}
function getOvFiltered(){
  var s=(document.getElementById('ov-search')||{}).value||'';s=s.toLowerCase();
  var dc=(document.getElementById('ov-dc')||{}).value||'';
  var lvl=(document.getElementById('ov-level')||{}).value||'';
  var jf=(document.getElementById('ov-jf')||{}).value||'';
  var dep=(document.getElementById('ov-dep')||{}).value||'';
  var leak=(document.getElementById('ov-leak')||{}).value||'';
  var proj=(document.getElementById('ov-proj')||{}).value||'';
  var util=(document.getElementById('ov-util')||{}).value||'';
  return DATA.filter(function(r){
    if(s&&r.employee.toLowerCase().indexOf(s)<0&&(r.currentProject||'').toLowerCase().indexOf(s)<0)return false;
    if(dc&&r.dc!==dc)return false;if(lvl&&r.level!==lvl)return false;if(jf&&r.jobFamily!==jf)return false;
    if(dep&&r.deployer!==dep)return false;
    if(leak==='_none_'&&r.leakageReason)return false;
    if(leak&&leak!=='_none_'&&r.leakageReason!==leak)return false;
    if(proj&&r.currentProject!==proj)return false;
    if(util){var lo=parseInt(util);if(lo===100&&r.avgUtil<100)return false;if(lo===80&&(r.avgUtil<80||r.avgUtil>=100))return false;
      if(lo===60&&(r.avgUtil<60||r.avgUtil>=80))return false;if(lo===40&&(r.avgUtil<40||r.avgUtil>=60))return false;if(lo===0&&r.avgUtil>=40)return false;}
    return true;
  }).sort(function(a,b){
    var av=a[ovSortKey],bv=b[ovSortKey];
    if(typeof av==='string')return ovSortDir*av.localeCompare(bv);
    if(av===null)av=-999;if(bv===null)bv=-999;return ovSortDir*(av-bv);
  });
}
function ovSort(key){if(ovSortKey===key)ovSortDir*=-1;else{ovSortKey=key;ovSortDir=-1;}renderOvTable();}

function renderOvTable(){
  var tbody=document.getElementById('ov-tbody');if(!tbody)return;

  document.getElementById('ov-count').textContent=rows.length+' of '+DATA.length+' resources';
  tbody.innerHTML=rows.map(function(r){
    var rmk=remarks[r.wdId||r.employee]||[];
    var rmkHtml=rmk.length?'<div class="remark-text">'+rmk[rmk.length-1].text+'<div class="remark-meta">— '+rmk[rmk.length-1].name+', '+rmk[rmk.length-1].date+'</div></div>':'';
    var rmkCount=rmk.length>1?' <span style="font-size:8px;color:var(--text3)">('+rmk.length+' total)</span>':'';
    return '<tr>'
    +'<td style="font-weight:500">'+r.employee+'</td>'
    +'<td>'+r.dc+'</td>'
    +'<td><span style="background:#F0F2F8;padding:1px 5px;border-radius:10px;font-size:9px">'+r.level+'</span></td>'
    +'<td style="max-width:130px;overflow:hidden;text-overflow:ellipsis">'+r.jobFamily+'</td>'
    +'<td style="color:var(--text3)">'+r.deployer+'</td>'
    +'<td>'+(r.availability===100?'<span class="util-pill low">100%</span>':r.availability>0?'<span class="util-pill mid">'+r.availability+'%</span>':'<span style="color:var(--text3)">0%</span>')+'</td>'
    +'<td>'+utilPill(r.avgUtil)+'</td>'
    +'<td style="color:var(--text3)">'+(r.utilTarget?r.utilTarget+'%':'—')+'</td>'
    +'<td>'+utilPill(r.febUtil)+'</td><td>'+utilPill(r.marUtil)+'</td><td>'+utilPill(r.aprUtil)+'</td><td>'+utilPill(r.mayUtil)+'</td>'
    +'<td>'+r.clientHrs.toLocaleString()+'</td>'
    +'<td style="color:var(--text3)">'+r.capacity.toLocaleString()+'</td>'
    +'<td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;font-size:9px">'+(r.currentProject||'—')+'</td>'
    +'<td style="font-size:9px;color:'+(r.leakageReason?'var(--pwc-orange)':'var(--text3)')+'">'+(r.leakageReason||'—')+'</td>'
    +'<td style="min-width:180px">'+rmkHtml+rmkCount
    +' <button class="remark-btn" onclick="openRemark(\''+((r.wdId||r.employee).replace(/'/g,"\\'"))+'\',\''+r.employee.replace(/'/g,"\\'")+'\')">+ Remark</button></td>'
    +'</tr>';
  }).join('');
}

function loadRemarks(){try{remarks=JSON.parse(localStorage.getItem('aes_remarks')||'{}');}catch(e){remarks={};}}
function saveRemarks(){try{localStorage.setItem('aes_remarks',JSON.stringify(remarks));}catch(e){}}
function openRemark(id,empName){
  var rmk=remarks[id]||[];
  var histHtml='';
  if(rmk.length){histHtml='<div class="remark-history"><div style="font-size:11px;font-weight:600;margin-bottom:6px">Previous Remarks</div>';
    rmk.slice().reverse().forEach(function(r){histHtml+='<div class="remark-entry"><div>'+r.text+'</div><div class="re-meta">— '+r.name+' · '+r.date+'</div></div>';});
    histHtml+='</div>';}
  document.getElementById('remark-title').textContent='Add Remark — '+empName;
  document.getElementById('remark-body').innerHTML='<div class="remark-form">'
    +'<label>Your Name</label><input id="rmk-name" placeholder="Enter your name" value="'+(localStorage.getItem('aes_rmk_user')||'')+'">'
    +'<label>Remark</label><textarea id="rmk-text" placeholder="Enter your comment..."></textarea>'
    +'<div class="paste-actions"><button class="btn-action" onclick="closeRemark()">Cancel</button>'
    +'<button class="btn-action primary" onclick="saveRemark(\''+id.replace(/'/g,"\\'")+'\')">Save Remark</button></div>'
    +'</div>'+histHtml;
  document.getElementById('remark-modal').classList.add('open');
}
function saveRemark(id){
  var name=document.getElementById('rmk-name').value.trim();
  var text=document.getElementById('rmk-text').value.trim();
  if(!name||!text){showToast('Please enter name and remark');return;}
  if(!remarks[id])remarks[id]=[];
  var now=new Date();var dt=now.toLocaleDateString()+' '+now.toLocaleTimeString();
  remarks[id].push({name:name,text:text,date:dt});
  localStorage.setItem('aes_rmk_user',name);
  saveRemarks();closeRemark();renderOvTable();showToast('Remark saved');
}
function closeRemark(){document.getElementById('remark-modal').classList.remove('open');}

// ── EXCEL DOWNLOAD ──
function downloadExcel(){
  var rows=getOvFiltered();
  var headers=['Employee','Delivery Center','Level','Job Family','Deployer','Availability','Avg Util','Target','Feb','Mar','Apr','May','Client Hrs','Capacity','Current Project','Leakage Reason','User Remarks'];
  var csv=headers.join(',')+'\n';
  rows.forEach(function(r){
    var rmk=remarks[r.wdId||r.employee]||[];
    var rmkText=rmk.length?rmk.map(function(x){return x.name+' ('+x.date+'): '+x.text;}).join(' | '):'';
    var vals=[r.employee,r.dc,r.level,r.jobFamily,r.deployer,r.availability+'%',r.avgUtil+'%',
      (r.utilTarget||'')+'%',r.febUtil!==null?r.febUtil+'%':'',r.marUtil!==null?r.marUtil+'%':'',
      r.aprUtil!==null?r.aprUtil+'%':'',r.mayUtil!==null?r.mayUtil+'%':'',
      r.clientHrs,r.capacity,r.currentProject||'',r.leakageReason||'',rmkText];
    csv+=vals.map(function(v){return '"'+(v+'').replace(/"/g,'""')+'"';}).join(',')+'\n';
  });
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='AES_Oracle_Overall_Data.csv';a.click();showToast('Excel file downloaded ('+rows.length+' rows)');
}

// ── NAV ──
function goTo(n){document.querySelectorAll('.slide').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.snav').forEach(function(s){s.classList.remove('active');});
  var slide=document.getElementById('slide-'+n);if(slide)slide.classList.add('active');
  var btns=document.querySelectorAll('.snav');if(btns[n])btns[n].classList.add('active');
  currentSlide=n;window.scrollTo({top:0,behavior:'smooth'});
  if(n===LEAKAGE_CATS.length+3){populateOvFilters();renderOvTable();}}
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'&&currentSlide<SLIDE_NAMES.length-1)goTo(currentSlide+1);
  if(e.key==='ArrowLeft'&&currentSlide>0)goTo(currentSlide-1);});

function readFile(f){if(!f)return;var r=new FileReader();r.onload=function(ev){loadCSV(ev.target.result);};r.readAsText(f,'windows-1252');}
function openPaste(){document.getElementById('paste-modal').classList.add('open');}
function closePaste(){document.getElementById('paste-modal').classList.remove('open');}
function parsePasted(){var txt=document.getElementById('paste-area').value.trim();if(!txt){showToast('Paste data first');return;}
  var lines=txt.split('\n').map(function(l){if(l.indexOf('\t')>=0)return l.split('\t').map(function(c){return c.indexOf(',')>=0?'"'+c+'"':c;}).join(',');return l;});
  loadCSV(lines.join('\n'));closePaste();}
function loadCSV(text){var mapped=mapRows(text);if(!mapped.length){showToast('Could not parse data');return;}DATA=mapped;currentSlide=0;render();showToast('Loaded '+DATA.length+' resources');}
function downloadPage(){var html='<!DOCTYPE html>'+document.documentElement.outerHTML;var blob=new Blob([html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AES_Resource_Utilization_Report.html';a.click();showToast('Downloaded!');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

(function(){
  loadRemarks();
  try{var b64=DEFAULT_CSV_B64;var bin=atob(b64);var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var text=new TextDecoder('windows-1252').decode(bytes);DATA=mapRows(text);
  }catch(e){console.error(e);}render();
})();
